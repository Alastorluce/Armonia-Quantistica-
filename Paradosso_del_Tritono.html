<!DOCTYPE html>
<html>
<head>
    <title>Sistema Caotico Armonico Definitivo</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Paradosso del Tritono neel Sistema Quantico</h3>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. INIZIALIZZAZIONE SCENA
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        // 2. SFERA CENTRALE CON SHADER DUALCOLOR
        const sphereGeometry = new THREE.SphereGeometry(12, 128, 128);
        const sphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                uniform vec3 color1;
                uniform vec3 color2;
                uniform float angle;
                
                void main() {
                    float mixValue = (dot(normalize(vNormal), vec3(cos(angle), 0.0, sin(angle))) + 1.0) * 0.5;
                    vec3 finalColor = mix(color1, color2, mixValue);
                    gl_FragColor = vec4(finalColor, 0.9);
                }
            `,
            uniforms: {
                color1: { value: new THREE.Color(0xFFA500) },
                color2: { value: new THREE.Color(0x00BFFF) },
                angle: { value: 0 }
            },
            transparent: true
        });

        const centralSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(centralSphere);

        // 3. SISTEMA PARTICELLE CAOTICO AVANZATO
        const particleCount = 10000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const velocities = new Float32Array(particleCount * 3);
        const seeds = new Float32Array(particleCount);

        // Inizializzazione
        for(let i = 0; i < particleCount; i++) {
            // Distribuzione sferica casuale
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const radius = 20 + Math.random() * 80;
            
            positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i*3+2] = radius * Math.cos(phi);

            // Velocità caotiche 3D
            velocities[i*3] = (Math.random() - 0.5) * 0.4;
            velocities[i*3+1] = (Math.random() - 0.5) * 0.4;
            velocities[i*3+2] = (Math.random() - 0.5) * 0.4;

            // Colori dinamici
            const isOrange = Math.random() > 0.5;
            colors[i*3] = isOrange ? 1.0 : 0.0;
            colors[i*3+1] = isOrange ? 0.6 : 0.75;
            colors[i*3+2] = isOrange ? 0.0 : 1.0;

            seeds[i] = Math.random() * 1000;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.2,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 4. ANIMAZIONE E CONTROLLI
        camera.position.set(0, 40, 120);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.minDistance = 30;
        controls.maxDistance = 500;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();
            const posArray = geometry.attributes.position.array;

            // Movimento caotico ibrido
            for(let i = 0; i < posArray.length; i += 3) {
                // Turbolenza frattale
                const noise = (
                    Math.sin(time * 0.3 + seeds[i/3]) +
                    Math.sin(time * 0.7 + seeds[i/3] * 2) * 0.5 +
                    Math.sin(time * 1.4 + seeds[i/3] * 4) * 0.25
                ) * 0.15;

                posArray[i] += velocities[i] + noise;
                posArray[i+1] += velocities[i+1] + noise;
                posArray[i+2] += velocities[i+2] + noise;

                // Reinizializzazione posizione con distribuzione sferica
                if(Math.sqrt(posArray[i]**2 + posArray[i+1]**2 + posArray[i+2]**2) > 150) {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    const radius = 20 + Math.random() * 30;
                    
                    posArray[i] = radius * Math.sin(phi) * Math.cos(theta);
                    posArray[i+1] = radius * Math.sin(phi) * Math.sin(theta);
                    posArray[i+2] = radius * Math.cos(phi);
                }
            }

            geometry.attributes.position.needsUpdate = true;
            
            // Animazione sfera
            centralSphere.material.uniforms.angle.value = time * 0.5;
            centralSphere.rotation.y = time * 0.2;
            centralSphere.rotation.x = time * 0.1;

            controls.update();
            renderer.render(scene, camera);
            
            document.getElementById('fps').textContent = Math.round(1 / delta);
        }

        // 5. ILLUMINAZIONE DINAMICA
        const pointLight = new THREE.PointLight(0xffffff, 1.2, 300);
        pointLight.position.set(50, 80, 100);
        scene.add(pointLight);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        animate();

        // 6. GESTIONE RESIZE
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
