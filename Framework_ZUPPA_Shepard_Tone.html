<style>
    /* VERSIONE CORRETTA - ZOOM CENTRATO */
    .zuppa-card {
        border-radius: 15px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        overflow: hidden;
        height: 100%;
        border-top: 4px solid;
        position: relative; /* Aggiunto */
        transform-origin: center center; /* Fondamentale per zoom centrato */
        will-change: transform; /* Ottimizzazione */
        margin: 15px 0; /* Spazio per lo zoom */
    }

    /* EFFETTO HOVER CORRETTO */
    .zuppa-card:hover {
        transform: scale(1.3); /* Solo zoom, senza translateY */
        box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        z-index: 100;
    }

    /* CONTENITORE PRINCIPALE - ESSENZIALE */
    .zuppa-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center; /* Centra le card */
    }

    /* CONTENUTO INTERNO */
    .zuppa-card-content {
        transition: all 0.3s ease;
        height: 100%;
    }

    /* Mantieni tutto il resto del tuo CSS esistente */
    .z-z { border-top-color: #3a86ff; }
    .z-u { border-top-color: #4cc9f0; }
    .z-p1 { border-top-color: #f72585; }
    .z-p2 { border-top-color: #7209b7; }
    .z-a { border-top-color: #4895ef; }
    .math-formula { /* ... mantieni stile esistente ... */ }
    .tech-badge { /* ... mantieni stile esistente ... */ }
    /* ... altri stili esistenti ... */
</style>
